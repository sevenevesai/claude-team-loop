<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>The team learning loop</title>
  <desc>Five stations on a circle around the team plugin: Work, Notice, Relay, Review, Release. Team members own the first three, the plugin owner the last two. A side panel lists what the loop grows: skills, working agreements, gates, hooks, integrations and shared resources.</desc>
  <rect width="1600" height="1000" fill="#FBF8F3"/>

  <text x="70" y="92" font-size="44" font-weight="700" fill="#211D18">The team learning loop</text>
  <text x="70" y="132" font-size="22" fill="#6B6259">The people who use the plugin are the people who improve it.</text>

  <!-- ring -->
  <circle cx="560" cy="580" r="250" fill="none" stroke="#D9CFC2" stroke-width="14"/>
  <path d="M 560 330 A 250 250 0 0 1 707 782" fill="none" stroke="#C4532F" stroke-width="14" stroke-linecap="round"/>
  <path d="M 413 782 A 250 250 0 0 1 560 330" fill="none" stroke="#1F7A75" stroke-width="14" stroke-linecap="round"/>
  <g fill="#FBF8F3">
    <g transform="translate(707,378) rotate(36)"><path d="M-9,-9 L9,0 L-9,9 Z"/></g>
    <g transform="translate(798,657) rotate(108)"><path d="M-9,-9 L9,0 L-9,9 Z"/></g>
    <g transform="translate(322,657) rotate(252)"><path d="M-9,-9 L9,0 L-9,9 Z"/></g>
    <g transform="translate(413,378) rotate(324)"><path d="M-9,-9 L9,0 L-9,9 Z"/></g>
  </g>
  <g transform="translate(560,830) rotate(180)" fill="#6B6259"><path d="M-9,-9 L9,0 L-9,9 Z"/></g>

  <text x="560" y="868" text-anchor="middle" font-size="16" font-weight="600" fill="#6B6259">shared sheet</text>

  <!-- centre: the plugin -->
  <circle cx="560" cy="580" r="128" fill="#211D18"/>
  <text x="560" y="548" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="3" fill="#D9CFC2">THE TEAM PLUGIN</text>
  <text x="560" y="586" text-anchor="middle" font-size="22" font-weight="600" fill="#FBF8F3">skills · agreements</text>
  <text x="560" y="614" text-anchor="middle" font-size="22" font-weight="600" fill="#FBF8F3">gates · hooks</text>
  <text x="560" y="652" text-anchor="middle" font-size="16" fill="#D99A2B">v1 → v2 → v3 → …</text>

  <!-- stations -->
  <g font-weight="700" font-size="30" text-anchor="middle" fill="#FBF8F3">
    <circle cx="560" cy="330" r="38" fill="#C4532F" stroke="#FBF8F3" stroke-width="6"/><text x="560" y="341">1</text>
    <circle cx="798" cy="503" r="38" fill="#C4532F" stroke="#FBF8F3" stroke-width="6"/><text x="798" y="514">2</text>
    <circle cx="707" cy="782" r="38" fill="#C4532F" stroke="#FBF8F3" stroke-width="6"/><text x="707" y="793">3</text>
    <circle cx="413" cy="782" r="38" fill="#1F7A75" stroke="#FBF8F3" stroke-width="6"/><text x="413" y="793">4</text>
    <circle cx="322" cy="503" r="38" fill="#1F7A75" stroke="#FBF8F3" stroke-width="6"/><text x="322" y="514">5</text>
  </g>

  <!-- station labels -->
  <g fill="#211D18">
    <text x="560" y="212" text-anchor="middle" font-size="26" font-weight="700">Work</text>
    <text x="560" y="242" text-anchor="middle" font-size="18" fill="#6B6259">People do real tasks with the plugin's skills.</text>

    <text x="858" y="480" font-size="26" font-weight="700">Notice</text>
    <text font-size="18" fill="#6B6259"><tspan x="858" y="510">Corrections, workarounds</tspan><tspan x="858" y="534">and wins collect in each</tspan><tspan x="858" y="558">person's own history.</tspan></text>

    <text x="768" y="800" font-size="26" font-weight="700">Relay</text>
    <text font-size="18" fill="#6B6259"><tspan x="768" y="830">Their own Claude turns it into a</tspan><tspan x="768" y="854">findings report. They approve it,</tspan><tspan x="768" y="878">and it lands in a shared sheet.</tspan></text>

    <text x="352" y="800" text-anchor="end" font-size="26" font-weight="700">Review</text>
    <text font-size="18" fill="#6B6259" text-anchor="end"><tspan x="352" y="830">The owner's nightly review</tspan><tspan x="352" y="854">merges the findings and</tspan><tspan x="352" y="878">answers every row.</tspan></text>

    <text x="262" y="480" text-anchor="end" font-size="26" font-weight="700">Release</text>
    <text font-size="18" fill="#6B6259" text-anchor="end"><tspan x="262" y="510">A new version reaches</tspan><tspan x="262" y="534">everyone's next</tspan><tspan x="262" y="558">session.</tspan></text>
  </g>

  <!-- legend -->
  <g font-size="17" fill="#211D18">
    <circle cx="80" cy="948" r="9" fill="#C4532F"/><text x="98" y="954">Team members</text>
    <circle cx="250" cy="948" r="9" fill="#1F7A75"/><text x="268" y="954">Plugin owner</text>
  </g>

  <!-- side panel -->
  <rect x="1130" y="170" width="410" height="760" rx="20" fill="#F1EAE0"/>
  <text x="1166" y="226" font-size="15" font-weight="600" letter-spacing="3" fill="#6B6259">WHAT THE LOOP GROWS</text>
  <text x="1166" y="262" font-size="20" fill="#211D18">Findings rarely stop at "another skill".</text>
  <g>
    <g transform="translate(1166,318)">
      <rect width="8" height="62" rx="4" fill="#C4532F"/>
      <text x="26" y="24" font-size="23" font-weight="700" fill="#211D18">Skills</text>
      <text x="26" y="52" font-size="17" fill="#6B6259">new ones, and fixes to shipped ones</text>
    </g>
    <g transform="translate(1166,414)">
      <rect width="8" height="62" rx="4" fill="#1F7A75"/>
      <text x="26" y="24" font-size="23" font-weight="700" fill="#211D18">Working agreements</text>
      <text x="26" y="52" font-size="17" fill="#6B6259">rules every session starts with</text>
    </g>
    <g transform="translate(1166,510)">
      <rect width="8" height="62" rx="4" fill="#1F7A75"/>
      <text x="26" y="24" font-size="23" font-weight="700" fill="#211D18">Gates</text>
      <text x="26" y="52" font-size="17" fill="#6B6259">a stop before anything risky</text>
    </g>
    <g transform="translate(1166,606)">
      <rect width="8" height="62" rx="4" fill="#1F7A75"/>
      <text x="26" y="24" font-size="23" font-weight="700" fill="#211D18">Hooks</text>
      <text x="26" y="52" font-size="17" fill="#6B6259">what should happen by itself</text>
    </g>
    <g transform="translate(1166,702)">
      <rect width="8" height="62" rx="4" fill="#D99A2B"/>
      <text x="26" y="24" font-size="23" font-weight="700" fill="#211D18">Integrations</text>
      <text x="26" y="52" font-size="17" fill="#6B6259">connectors where people copy by hand</text>
    </g>
    <g transform="translate(1166,798)">
      <rect width="8" height="62" rx="4" fill="#D99A2B"/>
      <text x="26" y="24" font-size="23" font-weight="700" fill="#211D18">Shared resources</text>
      <text x="26" y="52" font-size="17" fill="#6B6259">artifacts, templates, reusable services</text>
    </g>
  </g>
  <text x="1166" y="900" font-size="15" fill="#6B6259">Each one arrives with evidence: sessions and people.</text>
</svg>
