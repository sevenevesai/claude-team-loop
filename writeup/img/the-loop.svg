<text x="70" y="92" font-size="58" text-anchor="start" fill="#2a2420" font-weight="700" >the team learning loop</text>
<text x="72" y="140" font-size="27" text-anchor="start" fill="#6f6457" font-weight="400" >the people who use the plugin are the ones who improve it.</text>
