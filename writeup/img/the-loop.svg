<text x="800" y="178" font-size="34" text-anchor="middle" fill="#2a2420" font-weight="700" >1 · work</text>
<text x="800" y="211" font-size="24" text-anchor="middle" fill="#6f6457" font-weight="400" >people do real tasks with the plugin's skills</text>
<text x="1165" y="455" font-size="34" text-anchor="start" fill="#2a2420" font-weight="700" >2 · notice</text>
<text x="1165" y="490.0" font-size="24" text-anchor="start" fill="#6f6457" font-weight="400" >corrections, workarounds and</text><text x="1165" y="521.2" font-size="24" text-anchor="start" fill="#6f6457" font-weight="400" >wins pile up in each person's</text><text x="1165" y="552.4" font-size="24" text-anchor="start" fill="#6f6457" font-weight="400" >own history. nobody logs a thing.</text>
<text x="1060" y="800" font-size="34" text-anchor="start" fill="#2a2420" font-weight="700" >3 · relay</text>
<text x="1060" y="835.0" font-size="24" text-anchor="start" fill="#6f6457" font-weight="400" >their own Claude writes it up as a</text><text x="1060" y="866.2" font-size="24" text-anchor="start" fill="#6f6457" font-weight="400" >findings report. they approve it,</text><text x="1060" y="897.4" font-size="24" text-anchor="start" fill="#6f6457" font-weight="400" >then it goes on the shared sheet.</text>
<text x="545" y="800" font-size="34" text-anchor="end" fill="#2a2420" font-weight="700" >4 · review</text>
<text x="545" y="835.0" font-size="24" text-anchor="end" fill="#6f6457" font-weight="400" >the owner's nightly review</text><text x="545" y="866.2" font-size="24" text-anchor="end" fill="#6f6457" font-weight="400" >merges the findings and</text><text x="545" y="897.4" font-size="24" text-anchor="end" fill="#6f6457" font-weight="400" >answers every single one</text>
<text x="435" y="455" font-size="34" text-anchor="end" fill="#2a2420" font-weight="700" >5 · release</text>
<text x="435" y="490.0" font-size="24" text-anchor="end" fill="#6f6457" font-weight="400" >a new version lands in</text><text x="435" y="521.2" font-size="24" text-anchor="end" fill="#6f6457" font-weight="400" >everyone's next session</text>
