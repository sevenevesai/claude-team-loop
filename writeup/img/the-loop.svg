<text x="800" y="726" font-size="28" text-anchor="middle" fill="#2a2420" font-weight="700" >the plugin</text>
<text x="1195" y="225.0" font-size="30" text-anchor="start" fill="#b0452c" font-weight="700" transform="rotate(-3 1195 225.0)" >every lap it grows —</text><text x="1195" y="264.0" font-size="30" text-anchor="start" fill="#b0452c" font-weight="700" transform="rotate(-3 1195 264.0)" >and not just more skills</text>
<text x="800" y="925" font-size="22" text-anchor="middle" fill="#6f6457" font-weight="400" transform="rotate(-1 800 925)" >(one shared sheet in between)</text>
