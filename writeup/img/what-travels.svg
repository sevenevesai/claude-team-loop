<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Ink Free','Segoe Print','Bradley Hand','Comic Neue',cursive">
<title>What stays, what travels, what comes back</title>
<desc>Hand-drawn: notebooks that stay on a person's own machine; a paper plane passing an approval tick to a pin board of cards with statuses; the owner's desk at night with review, backlog, fix and a parcel; a long arrow returning to the person.</desc>
<defs>
  <filter id="w1" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
  <filter id="w2" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
  </filter>
  <filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="8"/>
    <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.09 0"/>
  </filter>
</defs>
